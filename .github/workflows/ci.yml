name: Python CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
    - name: Create Artifact
      run: |
         mkdir output
         cp app.py output/
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: output/

    - name: Run Tests
      run: |
        pytest
